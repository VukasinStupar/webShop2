services:
  postgres:
    image: postgres:16
    container_name: webshop2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456789"
      POSTGRES_DB: WebShop2
    ports:
      - "5433:5432"
    volumes:
      - webshop2-db-data:/var/lib/postgresql/data

volumes:
  webshop2-db-data:
