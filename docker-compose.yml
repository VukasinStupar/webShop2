
services:

  postgres:
    image: postgres:16
    container_name: webshop2-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: WebShop2

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - webshop2-db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d WebShop2"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: webshop2-backend
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=WebShop2;Username=postgres;Password=${POSTGRES_PASSWORD}"

      Jwt__SecretKey: ${JWT_SECRET_KEY}
      AdminRegistration__Key: ${ADMIN_REGISTRATION_KEY}

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy


  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: /api

    container_name: webshop2-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  webshop2-db-data:
